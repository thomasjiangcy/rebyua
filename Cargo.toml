[package]
name = "rebyua"
version = "0.8.1"
edition = "2024"
description = "Lightweight diff reviewer"
license = "MIT"
readme = "README.md"
default-run = "reb"

[[bin]]
name = "reb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.10"
notify = "8.2.0"
ratatui = "0.30.2"
ratatui-textarea = "0.9.3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tar = "0.4.46"
tempfile = "3.27.0"
